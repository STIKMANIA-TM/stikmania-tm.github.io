<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión | STIKMANIA</title>
    <meta name="theme-color" content="#00FF00">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Pirata+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00FF00;
            --black: #000000;
            --white: #FFFFFF;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container { max-width: 500px; }
        
        h1 {
            font-family: 'Pirata One', display;
            font-size: 3rem;
            color: var(--neon-green);
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        
        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        
        .btn {
            display: inline-block;
            background: var(--neon-green);
            color: var(--black);
            padding: 12px 28px;
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: var(--white);
            transform: translateY(-2px);
        }
        
        .retry-btn {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            margin-top: 15px;
        }
        
        .retry-btn:hover {
            background: var(--neon-green);
            color: var(--black);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Sin Conexión</h1>
        <p>Parece que no tienes conexión a internet. Algunas funciones de STIKMANIA pueden no estar disponibles.</p>
        <p>Las páginas que ya visitaste están disponibles offline. Para contenido nuevo, necesitarás conexión.</p>
        <a href="index.html" class="btn">Ir al Inicio</a>
        <br>
        <button class="btn retry-btn" onclick="window.location.reload()">🔄 Reintentar</button>
    </div>
    
    <script>
        // Escuchar eventos de conexión
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
